<script>
/* ============================================================
   iLasan Agri System - Client Application
   ============================================================ */

let currentPage = 'dashboard';

const pageTitles = {
  dashboard:'Dashboard',
  lahan:'Data Lahan',
  sop:'SOP Budidaya',
  aktivitas:'Aktivitas Budidaya',
  keuangan:'Catatan Biaya & Arus Kas',
  panen:'Panen & Pascapanen',
  aset:'Alat & Mesin',
  analisa:'Analisa Usaha Tani',
  laporan:'Laporan'
};

document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('.nav-item').forEach(btn => {
    btn.addEventListener('click', () => openPage(btn.dataset.page));
  });
  openPage('dashboard');
});

function openPage(page){
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(x => x.classList.toggle('active', x.dataset.page===page));
  document.getElementById('pageTitle').textContent = pageTitles[page] || page;

  if(page==='dashboard') loadDashboard();
  else if(page==='lahan') loadLahan();
  else if(page==='sop') loadSop();
  else if(page==='aktivitas') loadAktivitas();
  else if(page==='keuangan') loadKeuangan();
  else if(page==='panen') loadPanen();
  else if(page==='aset') loadAset();
  else if(page==='analisa') loadAnalisa();
  else if(page==='laporan') loadLaporan();
}

function refreshCurrent(){ openPage(currentPage); }

function setupApp(){
  gsRun('setupApplication').then(r=>{
    if(r.spreadsheetUrl){
      toast(r.message+' Buka spreadsheet: '+r.spreadsheetUrl, 8000);
    } else {
      toast(r.message);
    }
  }).catch(showError);
}

/* ---------------- Promise wrapper untuk google.script.run ---------------- */
function gsRun(fnName, ...args){
  return new Promise((resolve, reject) => {
    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fnName](...args);
  });
}

async function submitForm(saveFn, event, afterFn){
  event.preventDefault();
  const form = event.target;
  const data = extractFormData(form);
  try{
    const r = await gsRun(saveFn, data);
    toast(r.message);
    form.reset();
    if(afterFn) await afterFn();
  }catch(err){ showError(err); }
}

async function removeRecord(sheetName, id, afterFn, label){
  if(!confirm('Hapus data '+(label||id)+'? Tindakan ini tidak dapat dibatalkan.')) return;
  try{
    const r = await gsRun('deleteRecord', sheetName, id);
    toast(r.message);
    if(afterFn) await afterFn();
  }catch(err){ showError(err); }
}

/* ============================================================
   CACHE RECORD (dipakai fitur Lihat/Edit/Cetak per baris tabel)
   ============================================================ */
let recordCache = {};

function cacheRows(sheetName, rows, idField){
  recordCache[sheetName] = {};
  rows.forEach(r => { recordCache[sheetName][r[idField]] = r; });
}

function getCachedRecord(sheetName, id){
  return (recordCache[sheetName] && recordCache[sheetName][id]) || null;
}

function viewRecord(sheetName, id){
  const rec = getCachedRecord(sheetName, id);
  if(!rec){ toast('Data tidak ditemukan, muat ulang halaman.'); return; }
  showDetailModal(sheetName, rec);
}

function printRecordAction(sheetName, id){
  const rec = getCachedRecord(sheetName, id);
  if(!rec){ toast('Data tidak ditemukan.'); return; }
  showDetailModal(sheetName, rec);
  setTimeout(()=>window.print(), 200);
}

function editRecordAction(sheetName, id){
  const rec = getCachedRecord(sheetName, id);
  if(!rec){ toast('Data tidak ditemukan.'); return; }
  const form = document.querySelector('#content form');
  if(!form){ toast('Formulir edit tidak tersedia untuk data ini.'); return; }
  populateForm(form, rec);
  form.scrollIntoView({behavior:'smooth', block:'start'});
  toast('Mode edit aktif - ubah data lalu klik tombol Simpan.');
}

function populateForm(form, rec){
  Object.keys(rec).forEach(key=>{
    const el = form.querySelector(`[name="${key}"]`);
    if(!el) return;
    if(el.classList.contains('fmt-number')){
      el.value = formatDisplayNumber(Number(rec[key])||0);
    } else {
      el.value = rec[key] === null || rec[key] === undefined ? '' : rec[key];
    }
  });
}

function hiddenId(name){
  return `<input type="hidden" name="${name}" value="">`;
}

function formActions(label){
  return `<div class="form-actions">
    <button type="submit" class="btn btn-primary">${label}</button>
    <button type="button" class="btn btn-secondary" onclick="this.closest('form').reset()">Batal</button>
  </div>`;
}

function computedField(name, label){
  return `<div class="field"><label>${label}</label><input name="${name}" type="text" inputmode="decimal" class="fmt-number readonly-field" value="" readonly></div>`;
}

/* ---------------- Modal Detail (Lihat / Cetak) ---------------- */
function showDetailModal(sheetName, rec){
  const idKey = Object.keys(rec)[0];
  const title = prettyCol(sheetName) + ' — ' + (rec[idKey] || '');
  const rowsHtml = Object.keys(rec).map(k =>
    `<div class="detail-row"><div class="detail-label">${prettyCol(k)}</div><div class="detail-value">${formatCell(rec[k],k)}</div></div>`
  ).join('');
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = rowsHtml || '<div class="empty">Tidak ada data.</div>';
  document.getElementById('detailModal').classList.remove('hidden');
  document.body.classList.add('modal-open');
}

function closeModal(){
  document.getElementById('detailModal').classList.add('hidden');
  document.body.classList.remove('modal-open');
}

window.addEventListener('afterprint', () => {
  if(document.body.classList.contains('modal-open')) closeModal();
});

document.addEventListener('keydown', e => { if(e.key==='Escape') closeModal(); });

/* ---------------- Format angka: input teks dgn pemisah ribuan live ---------------- */
function formatNumberInput(el){
  let raw = el.value.replace(/[^0-9,]/g,'');
  const firstComma = raw.indexOf(',');
  if(firstComma !== -1){
    raw = raw.slice(0,firstComma+1) + raw.slice(firstComma+1).replace(/,/g,'');
  }
  const parts = raw.split(',');
  let intPart = parts[0].replace(/^0+(?=\d)/,'');
  intPart = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  const decPart = parts.length > 1 ? parts[1].slice(0,2) : null;
  el.value = decPart !== null ? intPart + ',' + decPart : intPart;
}

function parseFormattedNumber(str){
  if(str === undefined || str === null || str === '') return 0;
  const cleaned = String(str).replace(/\./g,'').replace(',', '.');
  const n = parseFloat(cleaned);
  return isNaN(n) ? 0 : n;
}

function formatDisplayNumber(n){
  if(n === null || n === undefined || isNaN(n) || n === 0) return n === 0 ? '0' : '';
  const isInt = Number.isInteger(n);
  return n.toLocaleString('id-ID', {maximumFractionDigits: isInt ? 0 : 2});
}

/** Field "Total"/"Jumlah" yang dihitung otomatis dari field lain pada form yang sama. */
const AUTO_TOTAL_RULES = [
  {qty:'QTY', harga:'HARGA_SATUAN', total:'TOTAL'},     // Keuangan
  {qty:'VOLUME', harga:'HARGA_SATUAN', total:'TOTAL'}   // Pemasaran
];
const AUTO_DIFF_RULES = [
  {a:'BERAT_MASUK', b:'BERAT_KELUAR', result:'SUSUT'}   // Pascapanen
];

function recalcAutoFields(form, changedName){
  AUTO_TOTAL_RULES.forEach(rule => {
    if(changedName !== rule.qty && changedName !== rule.harga) return;
    const qtyEl = form.querySelector(`[name="${rule.qty}"]`);
    const hargaEl = form.querySelector(`[name="${rule.harga}"]`);
    const totalEl = form.querySelector(`[name="${rule.total}"]`);
    if(!qtyEl || !hargaEl || !totalEl) return;
    const q = parseFormattedNumber(qtyEl.value);
    const h = parseFormattedNumber(hargaEl.value);
    totalEl.value = formatDisplayNumber(q*h);
  });
  AUTO_DIFF_RULES.forEach(rule => {
    if(changedName !== rule.a && changedName !== rule.b) return;
    const aEl = form.querySelector(`[name="${rule.a}"]`);
    const bEl = form.querySelector(`[name="${rule.b}"]`);
    const rEl = form.querySelector(`[name="${rule.result}"]`);
    if(!aEl || !bEl || !rEl) return;
    const av = parseFormattedNumber(aEl.value);
    const bv = parseFormattedNumber(bEl.value);
    rEl.value = formatDisplayNumber(Math.max(0, av-bv));
  });
}

document.addEventListener('input', e => {
  const t = e.target;
  if(!t || !t.classList || !t.classList.contains('fmt-number')) return;
  formatNumberInput(t);
  if(t.form) recalcAutoFields(t.form, t.name);
});

/** Ambil data form sebagai object, mengonversi field .fmt-number ke angka mentah. */
function extractFormData(form){
  const data = Object.fromEntries(new FormData(form).entries());
  form.querySelectorAll('.fmt-number').forEach(inp => {
    data[inp.name] = parseFormattedNumber(inp.value);
  });
  return data;
}

     </div>
     <div class="card" style="margin-top:16px">
      <div class="section-title">Biaya per Jenis Belanja</div>
      ${table(Object.entries(pl.byKategori).map(([k,v])=>({KATEGORI:k,TOTAL:v})),['KATEGORI','TOTAL'],null,null,null,null)}
     </div>
     <div class="card" style="margin-top:16px">
      <div class="section-title">Kinerja Penerimaan Komoditas</div>
      <p class="muted">Disajikan terpisah dari Laba/Rugi Usahatani karena biaya tidak dialokasikan ke masing-masing komoditas.</p>
      ${table(commodity.data,['KOMODITAS','VOLUME','HARGA_RATA_RATA','PENERIMAAN'],null,null,null,null)}
     </div>`;
  }catch(err){ showError(err); }
}

/* ============================================================
   LAPORAN
   ============================================================ */
let laporanTab = 'budidaya';

async function loadLaporan(){
  document.getElementById('content').innerHTML = laporanShell();
  await renderLaporanTab();
}

function laporanShell(){
  const tabs = [['budidaya','Budidaya'],['keuangan','Keuangan'],['produksi','Produksi'],['trace','Traceability']];
  return `<div class="tabs">${tabs.map(([k,l])=>tabBtn(k,l,laporanTab,'switchLaporanTab')).join('')}</div>
  <div id="subContent" class="tab-panel"><div class="empty">Memuat...</div></div>`;
}

async function switchLaporanTab(tab, evt){
  laporanTab = tab;
  document.querySelectorAll('#content .tabs .tab-btn').forEach(b=>b.classList.remove('active'));
  if(evt) evt.target.classList.add('active');
  await renderLaporanTab();
}

async function renderLaporanTab(){
  const el = document.getElementById('subContent');

  if(laporanTab==='budidaya'){
    const siklus = await gsRun('getSiklusData');
    el.innerHTML = `<div class="card">
      <div class="section-title">Laporan Budidaya per Siklus</div>
      <div class="form-grid">${selectField('LAP_SIKLUS','Siklus Budidaya',siklus.map(s=>({value:s.ID_SIKLUS,label:s.NAMA_SIKLUS+' - '+s.NAMA_BLOK})))}</div>
      <div class="form-actions"><button class="btn btn-primary" onclick="genLaporanBudidaya()">Tampilkan</button><button class="btn btn-secondary" onclick="window.print()">Cetak</button></div>
      <div id="laporanBudidayaResult" style="margin-top:14px"></div>
    </div>`;
  }

  else if(laporanTab==='keuangan'){
    el.innerHTML = `<div class="card">
      <div class="section-title">Laporan Keuangan per Periode</div>
      <div class="form-grid">${field('LAP_START','Tanggal Mulai','date')}${field('LAP_END','Tanggal Akhir','date')}</div>
      <div class="form-actions"><button class="btn btn-primary" onclick="genLaporanKeuangan()">Tampilkan</button><button class="btn btn-secondary" onclick="window.print()">Cetak</button></div>
      <div id="laporanKeuanganResult" style="margin-top:14px"></div>
    </div>`;
  }

  else if(laporanTab==='produksi'){
    el.innerHTML = `<div class="card">
      <div class="section-title">Laporan Produksi & Penjualan</div>
      <div class="form-grid">${field('LAP_START2','Tanggal Mulai','date')}${field('LAP_END2','Tanggal Akhir','date')}</div>
      <div class="form-actions"><button class="btn btn-primary" onclick="genLaporanProduksi()">Tampilkan</button><button class="btn btn-secondary" onclick="window.print()">Cetak</button></div>
      <div id="laporanProduksiResult" style="margin-top:14px"></div>
    </div>`;
  }

  else if(laporanTab==='trace'){
    const batch = await gsRun('getPanenData');
    el.innerHTML = `<div class="card">
      <div class="section-title">Laporan Traceability</div>
      <div class="form-grid">${selectField('LAP_BATCH','Batch Panen',batch.map(b=>({value:b.ID_BATCH,label:b.ID_BATCH+' - '+b.KOMODITAS})))}</div>
      <div class="form-actions"><button class="btn btn-primary" onclick="runTraceFromLaporan()">Tampilkan</button><button class="btn btn-secondary" onclick="window.print()">Cetak</button></div>
      <div id="traceResult" style="margin-top:14px"></div>
    </div>`;
  }
}

async function genLaporanBudidaya(){
  const id = document.querySelector('[name=LAP_SIKLUS]').value;
  const el = document.getElementById('laporanBudidayaResult');
  if(!id){ el.innerHTML='<div class="empty">Pilih siklus.</div>'; return; }
  el.innerHTML = '<div class="empty">Memuat...</div>';
  const r = await gsRun('getLaporanBudidaya', id);
  if(!r.ok){ el.innerHTML = `<div class="empty">${r.message}</div>`; return; }
  el.innerHTML = `<p><b>Siklus:</b> ${r.siklus.NAMA_SIKLUS} &middot; <b>Blok:</b> ${r.siklus.NAMA_BLOK||r.siklus.ID_BLOK}</p>
  <div class="section-title">Unit Budidaya</div>
  ${table(r.unit,['NAMA_KOMODITAS','NAMA_VARIETAS','LUAS','JUMLAH_TANAMAN'],null,null,null,null)}
  <div class="section-title" style="margin-top:14px">Aktivitas</div>
  ${table(r.aktivitas,['TANGGAL','TAHAPAN','AKTIVITAS','INPUT','STATUS'],null,null,null,null)}`;
}

async function genLaporanKeuangan(){
  const s = document.querySelector('[name=LAP_START]').value, e = document.querySelector('[name=LAP_END]').value;
  const el = document.getElementById('laporanKeuanganResult');
  el.innerHTML = '<div class="empty">Memuat...</div>';
  const r = await gsRun('getLaporanKeuangan', s, e);
  el.innerHTML = `<div class="grid grid-4">
   ${metric('Kas Masuk',rupiah(r.masuk),'Periode')}
   ${metric('Kas Keluar',rupiah(r.keluar),'Periode')}
   ${metric('Saldo',rupiah(r.saldo),'Kas masuk - kas keluar')}
   ${metric('Jumlah Transaksi',r.jumlahTransaksi,'Pada periode terpilih')}
  </div>
  <div class="section-title" style="margin-top:14px">Rincian Transaksi</div>
  ${table(r.transaksi,['TANGGAL','JENIS','KATEGORI','ITEM','TOTAL'],null,null,null,null)}`;
}

async function genLaporanProduksi(){
  const s = document.querySelector('[name=LAP_START2]').value, e = document.querySelector('[name=LAP_END2]').value;
  const el = document.getElementById('laporanProduksiResult');
  el.innerHTML = '<div class="empty">Memuat...</div>';
  const r = await gsRun('getLaporanProduksi', s, e);

   ${metric('Total Berat Panen',r.totalBerat,'Seluruh batch pada periode')}
   ${metric('Total Penjualan',rupiah(r.totalPenjualan),'Seluruh penjualan pada periode')}
  </div>
  <div class="section-title" style="margin-top:14px">Panen</div>
  ${table(r.panen,['ID_BATCH','TANGGAL_PANEN','KOMODITAS','BERAT_TOTAL','SATUAN'],null,null,null,null)}
  <div class="section-title" style="margin-top:14px">Penjualan</div>
  ${table(r.penjualan,['ID_PENJUALAN','TANGGAL','PEMBELI','KOMODITAS','VOLUME','TOTAL'],null,null,null,null)}`;
}

async function runTraceFromLaporan(){
  const id = document.querySelector('[name=LAP_BATCH]').value;
  document.querySelector('[name=TRACE_BATCH]')?.setAttribute('value', id);
  const el = document.getElementById('traceResult');
  if(!id){ el.innerHTML = '<div class="empty">Pilih batch.</div>'; return; }
  el.innerHTML = '<div class="empty">Memuat...</div>';
  const r = await gsRun('getLaporanTraceability', id);
  if(!r.ok){ el.innerHTML = `<div class="empty">${r.message}</div>`; return; }
  el.innerHTML = `
  <p><b>Petani:</b> ${r.petani?r.petani.NAMA:'-'} &middot; <b>Lahan:</b> ${r.lahan?r.lahan.NAMA_LAHAN:'-'} &middot; <b>Blok:</b> ${r.blok?r.blok.NAMA_BLOK:'-'}</p>
  <p><b>Komoditas:</b> ${r.panen.KOMODITAS} / ${r.panen.VARIETAS||'-'} &middot; <b>Berat:</b> ${r.panen.BERAT_TOTAL} ${r.panen.SATUAN||''}</p>
  <div class="section-title" style="margin-top:10px">Penjualan</div>
  ${table(r.penjualan,['TANGGAL','PEMBELI','VOLUME','TOTAL'],null,null,null,null)}`;
}

/* ============================================================
   KOMPONEN UI (form field, select, table)
   ============================================================ */
function field(name,label,type='text',value='',required=false){
 if(Array.isArray(value)) return `<div class="field"><label>${label}</label><select name="${name}" ${required?'required':''}>${value.map(x=>`<option>${x}</option>`).join('')}</select></div>`;
 if(type==='number'){
   return `<div class="field"><label>${label}</label><input name="${name}" type="text" inputmode="decimal" autocomplete="off" class="fmt-number" value="${value}" ${required?'required':''}></div>`;
 }
 return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" value="${value}" ${required?'required':''}></div>`;
}

function selectField(name,label,options,required=false,placeholder='Pilih...'){
 options = options || [];
 return `<div class="field"><label>${label}</label><select name="${name}" ${required?'required':''}>
   <option value="">${placeholder}</option>
   ${options.map(o=>`<option value="${o.value}">${o.label}</option>`).join('')}
 </select></div>`;
}

/**
 * afterCall: potongan kode JS (string) yang dipanggil ulang setelah data dihapus,
 * misalnya "renderMasterTab()" atau "renderSopDetailList('SOP-123')".
 * Menggunakan string (bukan referensi fungsi) agar closure dengan parameter
 * (mis. daftar per ID) tetap berfungsi saat dipanggil dari atribut onclick.
 */
function table(rows,cols,sheetName,idField,labelField,afterCall){
 if(!rows || !rows.length) return '<div class="empty">Belum ada data.</div>';
 const showActions = !!sheetName;
 if(showActions) cacheRows(sheetName, rows, idField);
 const afterFnLiteral = afterCall ? `()=>{${afterCall}}` : 'null';
 return `<div class="table-wrap"><table><thead><tr>${cols.map(c=>`<th>${prettyCol(c)}</th>`).join('')}${showActions?'<th>Aksi</th>':''}</tr></thead><tbody>${
 rows.map(r=>{
   const id = r[idField];
   const label = String(r[labelField]||'').replace(/'/g,"");
   const actions = showActions ? `<td class="actions-cell">
     <button class="btn-link" onclick="viewRecord('${sheetName}','${id}')">Lihat</button>
     <button class="btn-link" onclick="editRecordAction('${sheetName}','${id}')">Edit</button>
     <button class="btn-link" onclick="printRecordAction('${sheetName}','${id}')">Cetak</button>
     <button class="btn-link btn-link-danger" onclick="removeRecord('${sheetName}','${id}',${afterFnLiteral},'${label}')">Hapus</button>
   </td>` : '';
   return `<tr>${cols.map(c=>`<td>${formatCell(r[c],c)}</td>`).join('')}${actions}</tr>`;
 }).join('')
 }</tbody></table></div>`;
}

function prettyCol(c){ return c.replace(/_/g,' '); }

function formatCell(v,k){
 if(v===null||v===undefined||v==='') return '-';
 if(['TOTAL','HARGA_SATUAN','HARGA_PEROLEHAN','NILAI_RESIDU','NILAI_PENYUSUTAN','AKUMULASI_PENYUSUTAN','NILAI_BUKU','PENERIMAAN','HARGA_RATA_RATA'].includes(k)) return rupiah(v);
 return String(v);
}

function rupiah(v){return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(Number(v||0));}
function comingSoon(name){return `<div class="card"><div class="section-title">${name}</div><p class="muted">Modul sedang disiapkan pada tahap berikutnya.</p></div>`;}
function toast(msg, duration){const el=document.getElementById('toast');el.textContent=msg;el.style.display='block';setTimeout(()=>el.style.display='none',duration||2500);}
function showError(err){toast('Error: '+(err.message||err));console.error(err);}
</script>
